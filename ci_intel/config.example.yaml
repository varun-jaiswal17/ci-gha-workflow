# ci_intel configuration — copy this file to ci_intel/config.yaml for deployment.
# config.yaml is gitignored; config.example.yaml is the committed reference.

# Workflows the ingest and dispatcher track.
# Use the exact "name:" value from each workflow YAML file.
monitored_workflows:
  - "OCV PR:5.x ARM64"
  - "OCV PR:5.x W10"
  - "OCV PR:5.x macOS ARM64"
  - "OCV PR:5.x macOS x86_64"
  - "OCV PR:4.x ARM64"
  - "OCV PR:4.x W10"

# Storage backend (Phase 1: ndjson — append-only git branch)
store:
  backend: ndjson
  branch: ci-intel-data
  file: data/runs.ndjson
  # Maximum age of rows used for queries (days). Older rows are ignored at query
  # time but remain in the file; run `ci_intel/store/prune.py` to trim the file.
  lookback_days: 90

# Priority scoring weights (Phase 3).
# failed_on_prev_run is dominant — it ensures the job the contributor is
# actively fixing always runs first.
weights:
  failed_on_prev_run: 10.0   # binary 0/1; massive boost when 1
  flake_penalty: 2.0          # pushes known flaky jobs to the back
  short_job_first: 1.0        # faster first feedback
  branch_stability: 1.0       # tiebreaker

# Dispatcher mode.
#   shadow — compute scores and log them; do not reorder anything (safe default)
#   live   — fire workflow_dispatch calls in priority order (requires CI_INTEL_PAT)
scheduler_mode: shadow
