name: OCV Priority Dispatcher

# Priority-label dispatcher.
#
# When a reviewer adds a `priority:*` label to a PR, dispatch the matching
# platform workflows first. Label -> platform groupings come from
# priority-label-mapping.md (repo root). This follows the repo's existing
# label-gating convention:
#   if: contains(github.event.pull_request.labels.*.name, 'category:dnn_timvx')
#
# NOTE: a workflow can only be dispatched via the API once its file (with
# `workflow_dispatch:` in `on:`) is present on the repository DEFAULT branch.
# Workflows that are not yet dispatch-enabled simply log a warning here.

on:
  pull_request:
    types: [labeled]
    branches: [main]

# `gh workflow run` needs write access to the Actions API.
permissions:
  actions: write
  contents: read

jobs:
  dispatch-priority:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Dispatch priority: Windows workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:windows') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-Contrib-PR-3.4-W10.yaml \
            OCV-Contrib-PR-4.x-W10.yaml \
            OCV-Contrib-PR-5.x-W10.yaml \
            OCV-Contrib-WinPack-4.x-W10.yaml \
            OCV-PR-3.4-W10.yaml \
            OCV-PR-4.x-W10-Vulkan.yaml \
            OCV-PR-4.x-W10.yaml \
            OCV-PR-5.x-W10-ARM64.yaml \
            OCV-PR-5.x-W10-UWP.yaml \
            OCV-PR-5.x-W10-Vulkan.yaml \
            OCV-PR-5.x-W10.yaml \
            OCV-PR-Windows.yaml \
            OCV-WinPack-4.x-W10.yaml \
            OCV-WinPack-5.x-W10.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: Linux workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:linux') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-Contrib-PR-3.4-U20.yaml \
            OCV-Contrib-PR-4.x-U20-Cuda.yaml \
            OCV-Contrib-PR-5.x-U20-Cuda.yaml \
            OCV-Coverage-4.x-U20.yaml \
            OCV-PR-3.4-U20.yaml \
            OCV-PR-4.x-U20-Cuda.yaml \
            OCV-PR-4.x-U20-OpenVINO.yaml \
            OCV-PR-5.x-U20-Cuda.yaml \
            OCV-PR-5.x-U20-OpenVINO.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: ARM workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:ARM') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-Contrib-PR-3.4-ARM64.yaml \
            OCV-Contrib-PR-3.4-macOS-ARM64.yaml \
            OCV-Contrib-PR-4.x-ARM64-FastCV.yaml \
            OCV-Contrib-PR-4.x-ARM64.yaml \
            OCV-Contrib-PR-4.x-macOS-ARM64.yaml \
            OCV-Contrib-PR-5.x-ARM64-FastCV.yaml \
            OCV-Contrib-PR-5.x-ARM64.yaml \
            OCV-Contrib-PR-5.x-macOS-ARM64.yaml \
            OCV-PR-3.4-ARM64.yaml \
            OCV-PR-3.4-macOS-ARM64.yaml \
            OCV-PR-4.x-ARM64-Debug.yaml \
            OCV-PR-4.x-ARM64.yaml \
            OCV-PR-4.x-macOS-ARM64-Vulkan.yaml \
            OCV-PR-4.x-macOS-ARM64.yaml \
            OCV-PR-5.x-ARM64-Debug.yaml \
            OCV-PR-5.x-ARM64.yaml \
            OCV-PR-5.x-W10-ARM64.yaml \
            OCV-PR-5.x-macOS-ARM64-Vulkan.yaml \
            OCV-PR-5.x-macOS-ARM64.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: Mac/iOS workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:mac') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-Contrib-PR-3.4-macOS-ARM64.yaml \
            OCV-Contrib-PR-3.4-macOS-x86_64.yaml \
            OCV-Contrib-PR-4.x-macOS-ARM64.yaml \
            OCV-Contrib-PR-4.x-macOS-x86_64.yaml \
            OCV-Contrib-PR-5.x-macOS-ARM64.yaml \
            OCV-Contrib-PR-5.x-macOS-x86_64.yaml \
            OCV-PR-3.4-iOS.yaml \
            OCV-PR-3.4-macOS-ARM64.yaml \
            OCV-PR-3.4-macOS-x86_64.yaml \
            OCV-PR-4.x-iOS.yaml \
            OCV-PR-4.x-macOS-ARM64-Vulkan.yaml \
            OCV-PR-4.x-macOS-ARM64.yaml \
            OCV-PR-4.x-macOS-x86_64.yaml \
            OCV-PR-5.x-iOS.yaml \
            OCV-PR-5.x-macOS-ARM64-Vulkan.yaml \
            OCV-PR-5.x-macOS-ARM64.yaml \
            OCV-PR-5.x-macOS-x86_64.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: ALL (remaining workflows)"
        # priority:ALL is handled co-operatively: the four platform steps above
        # each include `|| priority:ALL`, so they already cover Windows, Linux
        # (incl. CUDA), ARM and Mac/iOS. This step dispatches everything else
        # (Android, RISC-V and uncategorised workflows) so priority:ALL covers
        # every workflow exactly once -- no duplicate dispatches.
        if: contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-4.x-Android-SDK.yaml \
            OCV-PR-3.4-Android.yaml \
            OCV-PR-4.x-Android-Test.yaml \
            OCV-PR-5.x-Android.yaml \
            OCV-Contrib-PR-4.x-RISCV.yaml \
            OCV-Contrib-PR-5.x-RISCV.yaml \
            OCV-Nightly-RISCV.yaml \
            OCV-PR-4.x-RISCV.yaml \
            OCV-PR-5.x-RISCV.yaml \
            OCV-CodeQL.yaml \
            OCV-Contrib-PR-4.x-O22-CANN.yaml \
            OCV-DNN-models-update.yaml \
            OCV-Git-Cache.yaml \
            OCV-PR-3.4-docs.yaml \
            OCV-PR-4.x-docs.yaml \
            OCV-PR-4.x-loongnix-loongarch64.yaml \
            OCV-PR-5.x-docs.yaml \
            OCV-PR-Linux-Alpine.yaml \
            OCV-PR-Linux-NoHAL.yaml \
            OCV-PR-Linux.yaml \
            OCV-timvx-backend-tests-4.x.yml \
            build_docs_schedule.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: Summary
        if: always()
        run: |
          echo "Labels on this PR:"
          echo '${{ toJSON(github.event.pull_request.labels.*.name) }}'
          {
            echo "## Priority dispatch summary"
            echo ""
            echo "Triggering label: \`${{ github.event.label.name }}\`"
            echo ""
            echo "| priority label | detected | dispatched group |"
            echo "|----------------|:--------:|------------------|"
            echo "| priority:windows | ${{ contains(github.event.pull_request.labels.*.name, 'priority:windows') }} | Windows (14) |"
            echo "| priority:linux   | ${{ contains(github.event.pull_request.labels.*.name, 'priority:linux') }} | Linux (9) |"
            echo "| priority:ARM     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:ARM') }} | ARM (19) |"
            echo "| priority:mac     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:mac') }} | Mac/iOS (17) |"
            echo "| priority:ALL     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:ALL') }} | every workflow |"
            echo ""
            echo "_Per-workflow dispatch results (and any warnings for not-yet-enabled workflows) are in the step logs above._"
          } >> "$GITHUB_STEP_SUMMARY"
