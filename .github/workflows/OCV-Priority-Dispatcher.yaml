name: OCV Priority Dispatcher

# Priority-label dispatcher, scoped to the CURRENT 5.x PR flow.
#
# Mirrors the jobs in opencv/opencv .github/workflows/PR-5.x.yaml: when a
# reviewer adds a priority:<platform> label to a PR, dispatch first the same
# workflows the 5.x flow runs for that platform -- not every workflow in the
# repo. priority:ALL dispatches the entire 5.x flow.
#
# Follows the repo's existing label convention:
#   if: contains(github.event.pull_request.labels.*.name, 'category:dnn_timvx')
#
# A workflow is only API-dispatchable once its file (with workflow_dispatch in
# `on:`) is on the DEFAULT branch; ones not yet enabled just log a warning.

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-priority:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Dispatch priority: Windows workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:windows') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-PR-Windows.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: Linux workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:linux') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-PR-Linux.yaml \
            OCV-PR-Linux-NoHAL.yaml \
            OCV-PR-Linux-Alpine.yaml \
            OCV-PR-5.x-U20-OpenVINO.yaml \
            OCV-PR-5.x-U20-Cuda.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: ARM workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:ARM') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-PR-5.x-ARM64.yaml \
            OCV-PR-5.x-ARM64-Debug.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: Mac/iOS workflows"
        if: |
          contains(github.event.pull_request.labels.*.name, 'priority:mac') ||
          contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-PR-5.x-macOS-ARM64.yaml \
            OCV-PR-5.x-macOS-x86_64.yaml \
            OCV-PR-5.x-iOS.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: "Dispatch priority: ALL (remaining 5.x-flow workflows)"
        # The four platform steps above already fire on `|| priority:ALL`
        # (Windows/Linux/ARM/Mac). This step adds the rest of the 5.x flow
        # (Android, RISC-V, TIM-VX, docs) so priority:ALL dispatches the whole
        # flow exactly once -- no duplicate dispatches.
        if: contains(github.event.pull_request.labels.*.name, 'priority:ALL')
        run: |
          for wf in \
            OCV-PR-5.x-Android.yaml \
            OCV-PR-5.x-RISCV.yaml \
            OCV-timvx-backend-tests-4.x.yml \
            OCV-PR-5.x-docs.yaml ; do
            echo "-> dispatching $wf"
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.head_ref }}" \
              || echo "::warning::Could not dispatch $wf (workflow_dispatch not enabled on the default branch yet?)"
          done

      - name: Summary
        if: always()
        run: |
          echo "Labels on this PR:"
          echo '${{ toJSON(github.event.pull_request.labels.*.name) }}'
          {
            echo "## Priority dispatch summary (scoped to the 5.x flow)"
            echo ""
            echo "Triggering label: \`${{ github.event.label.name }}\`"
            echo ""
            echo "| priority label | detected | dispatches |"
            echo "|----------------|:--------:|------------|"
            echo "| priority:windows | ${{ contains(github.event.pull_request.labels.*.name, 'priority:windows') }} | OCV-PR-Windows |"
            echo "| priority:linux   | ${{ contains(github.event.pull_request.labels.*.name, 'priority:linux') }} | Linux + NoHAL + Alpine + OpenVINO + CUDA |"
            echo "| priority:ARM     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:ARM') }} | 5.x ARM64 (+ Debug) |"
            echo "| priority:mac     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:mac') }} | 5.x macOS ARM64/x86_64 + iOS |"
            echo "| priority:ALL     | ${{ contains(github.event.pull_request.labels.*.name, 'priority:ALL') }} | entire 5.x flow |"
            echo ""
            echo "_Per-workflow results (and warnings for not-yet-enabled workflows) are in the step logs above._"
          } >> "$GITHUB_STEP_SUMMARY"
