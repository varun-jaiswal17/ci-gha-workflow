name: CI-Intel Ingest

# Fires after any monitored workflow completes (success or failure).
# IMPORTANT: workflow_run triggers only activate from the default branch.
#            This file must be merged to main before it will fire.
on:
  workflow_run:
    workflows:
      - "OCV PR:5.x ARM64"
      - "OCV PR:5.x W10"
      - "OCV PR:5.x macOS ARM64"
      - "OCV PR:5.x macOS x86_64"
      - "OCV PR:4.x ARM64"
      - "OCV PR:4.x W10"
    types:
      - completed

permissions:
  actions: read      # download artifacts and log zips
  contents: write    # push facts to ci-intel-data branch

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Skip re-triggered or cancelled runs that have no useful data
    if: >
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ci_intel/requirements.txt

      - name: Configure git identity for data branch commits
        run: |
          git config --global user.name  "ci-intel"
          git config --global user.email "ci-intel@noreply.github.com"

      - name: Ingest completed run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_INTEL_REPO: ${{ github.repository }}
        run: |
          python -m ci_intel.collector.ingest \
            --run-id "${{ github.event.workflow_run.id }}"
