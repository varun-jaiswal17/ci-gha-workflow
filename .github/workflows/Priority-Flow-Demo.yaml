name: Priority Flow Demo

# Runnable demo of SCORE-DRIVEN priority gating on GitHub-hosted runners only
# (no opencv self-hosted infra needed), so it works on a personal fork.
#
# The `priority-gate` job blocks on a cheap ubuntu runner until the scheduler
# releases this run — highest score first, one run active at a time
# (max-concurrent: 1).  The stub "heavy" jobs all `needs: priority-gate`, so
# they only start once released; a final job frees the slot for the next run.
#
# To SEE the ordering: open two PRs at once.  The one whose (PR, workflow) scores
# higher in the ci-intel-data store is released and runs first; the other waits
# in the gate until the first finishes.  Scores come from the backfilled history.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write   # the gate reads/writes the ci-intel-data queue branch

jobs:
  # ─────────── GATE — score this run and hold until it is our turn ───────────
  priority-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for priority release
        uses: ./priority-gate
        with:
          workflow: "Priority Flow Demo"
          max-concurrent: "1"
          timeout: "1800"
          poll-interval: "15"

  # ─────────── MAIN LANE (stubs) — all wait for the gate to release ───────────
  Linux:
    needs: priority-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "Linux running"
          sleep 15

  Windows:
    needs: priority-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "Windows running"
          sleep 15

  ARM64:
    needs: priority-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "ARM64 running"
          sleep 15

  macOS:
    needs: priority-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "macOS running"
          sleep 15

  # ─────────── RELEASE — free the slot for the next waiting run ───────────
  release-slot:
    needs: [Linux, Windows, ARM64, macOS]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release priority slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_INTEL_REPO: ${{ github.repository }}
        run: |
          python3 -m ci_intel.scheduler.gate release --run-id "${{ github.run_id }}"
